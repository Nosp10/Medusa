[project]
name = "medusa"
version = "0.1.0"
description = "Graph-native defense prototyping workspace"
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"
port = 8000

[test]
directory = "tests"
verbose = true

[plugins.client.app_meta_data]
title = "MEDUSA — Graph-native prototyping"
description = "Turn available inventory into an explainable, mission-ready prototype."
theme_color = "#171A1F"
